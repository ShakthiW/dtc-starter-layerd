# LAYERD production stack on the droplet. Lives in /opt/layerd, with the
# repo cloned at /opt/layerd/app. Only Caddy is published (80/443).
#
# The database is the droplet's existing Postgres (holaa-postgres-1), with
# its own `layerd` database and role; the backend joins that network.
name: layerd

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    mem_limit: 128m

  backend:
    build:
      context: ./app
      dockerfile: apps/backend/Dockerfile
    image: layerd-backend:latest
    restart: unless-stopped
    env_file: backend.env
    depends_on:
      - redis
    networks:
      - default
      - holaa
    volumes:
      # Product photos uploaded through the admin
      - uploads:/repo/apps/backend/.medusa/server/static
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 120s
      retries: 10
    mem_limit: 1200m

  storefront:
    build:
      context: ./app
      dockerfile: apps/storefront/Dockerfile
      args:
        # Set in /opt/layerd/.env once the backend has created it
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${STOREFRONT_PUBLISHABLE_KEY:-}
    image: layerd-storefront:latest
    restart: unless-stopped
    environment:
      # Server-side calls stay on the private network
      MEDUSA_BACKEND_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 640m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - backend
    mem_limit: 128m

networks:
  holaa:
    name: holaa_default
    external: true

volumes:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
