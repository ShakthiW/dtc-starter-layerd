# LAYERD production stack on the droplet. Lives in /opt/layerd, with the
# repo cloned at /opt/layerd/app (deploy files copied up from app/deploy).
#
# Images are built in GitHub Actions (or locally with deploy/ship.sh) and only
# pulled or loaded here: nothing is built on the droplet.
#
# The database is the droplet's existing Postgres (holaa-postgres-1), with
# its own `layerd` database and role; the backend joins that network.
#
# This stack's Caddy is also the droplet's SHARED edge proxy (see EDGE.md):
# it serves layerd, neet and hydrokra on 80/443 (+8443 for neet behind
# Cloudflare), and the standord-bridge ingress. Keep the project name, the
# service name and the caddy_* volumes: standord-bridge is wired to the
# layerd-caddy-1 container and the layerd_caddy_config volume.
name: layerd

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    mem_limit: 128m

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/shakthiw/layerd-backend:latest}
    pull_policy: missing
    restart: unless-stopped
    env_file: backend.env
    depends_on:
      - redis
    networks:
      - default
      - holaa
    volumes:
      # Product photos uploaded through the admin
      - uploads:/repo/apps/backend/.medusa/server/static
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 120s
      retries: 10
    mem_limit: 1200m

  storefront:
    image: ${STOREFRONT_IMAGE:-ghcr.io/shakthiw/layerd-storefront:latest}
    pull_policy: missing
    restart: unless-stopped
    environment:
      # Server-side calls stay on the private network
      MEDUSA_BACKEND_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 640m

  # Shared edge proxy for every app on the droplet. Sites for other projects are
  # files in /opt/caddy-sites (installed with caddy-site), their certificates in
  # /opt/caddy-certs. It reaches each project over that project's edge-* network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # neet. behind Cloudflare (an Origin Rule sends its hostnames to 8443)
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy-sites:/etc/caddy/sites:ro
      - /opt/caddy-certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge-neet
      - edge-hydrokra
    mem_limit: 160m

networks:
  holaa:
    name: holaa_default
    external: true
  # one network per project, created once by deploy/edge/cutover.sh
  edge-neet:
    name: edge-neet
    external: true
  edge-hydrokra:
    name: edge-hydrokra
    external: true

volumes:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
